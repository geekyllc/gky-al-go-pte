name: 'Update Workflows (3-Way Merge)'

on:
  workflow_dispatch:
    inputs:
      templateRepository:
        description: >-
          Template repository in 'owner/repo' format.
          Leave empty to use gkySettings.workflowUpdater.templateRepository.
        required: false
        default: ''
      baseRepository:
        description: >-
          Base repository in 'owner/repo' format. This is the repository from which
          originalRef was taken (i.e., the template that was previously applied to this
          repository). Leave empty to use gkySettings.workflowUpdater.baseRepository.
        required: false
        default: ''
      originalRef:
        description: >-
          The git ref (tag/commit SHA) of the template that was previously applied to
          this repository. Leave empty to use gkySettings.workflowUpdater.baseRef.
        required: false
        default: ''
      newRef:
        description: >-
          The git ref (tag/branch/commit SHA) of the template version to update to.
          Leave empty to use gkySettings.workflowUpdater.templateRef, then HEAD if unset.
        required: false
        default: ''
      conflictStrategy:
        description: 'How to handle step conflicts: template-wins, destination-wins, or error'
        required: false
        default: 'template-wins'
      directCommit:
        description: 'Commit changes directly to the branch instead of creating a pull request'
        type: boolean
        default: false
      includeBranches:
        description: >-
          Comma-separated list of branches to update. Leave empty to update the
          current branch only.
        required: false
        default: ''

  workflow_call:
    inputs:
      caller:
        description: Name of the calling workflow (use github.workflow as value when calling)
        type: string
        required: true
      templateRepository:
        description: Template repository in 'owner/repo' format (empty = workflowUpdater setting)
        type: string
        required: false
        default: ''
      baseRepository:
        description: >-
          Base repository in 'owner/repo' format (the repo from which originalRef was
          taken). Leave empty to use gkySettings.workflowUpdater.baseRepository.
        type: string
        required: false
        default: ''
      originalRef:
        description: Previously-applied template ref (empty = workflowUpdater.baseRef)
        type: string
        required: false
        default: ''
      newRef:
        description: New template ref (empty = workflowUpdater.templateRef, then HEAD)
        type: string
        required: false
        default: ''
      conflictStrategy:
        description: 'Conflict strategy: template-wins, destination-wins, or error'
        type: string
        required: false
        default: 'template-wins'
      directCommit:
        description: Commit directly instead of creating a pull request
        type: boolean
        default: false
      includeBranches:
        description: Comma-separated list of branches to update (empty = current branch only)
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # Resolve which branches to process and the concrete new ref,
  # then build a branch-only matrix for the MergeAndCommit job.
  # ──────────────────────────────────────────────────────────────
  Initialize:
    name: Initialize
    runs-on: [ self-hosted, ubuntu-latest ]
    outputs:
      updateBranches: ${{ steps.resolve-branches.outputs.branches }}
      templateRepository: ${{ steps.resolve-settings.outputs.templateRepository }}
      baseRepository: ${{ steps.resolve-settings.outputs.baseRepository }}
      originalRef: ${{ steps.resolve-settings.outputs.originalRef }}
      resolvedNewRef: ${{ steps.resolve-ref.outputs.newRef }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.0
        with:
          shell: powershell
          get: gkySettings

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v9.0
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'TokenForPush'
          useGhTokenWorkflowForPush: 'true'

      - name: Clean up workspace
        uses: geekyllc/gky-gha-cleanup-workspace@v0.2.1
        with:
          keep-git: false
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}

      - name: Resolve workflow updater settings
        id: resolve-settings
        uses: actions/github-script@v9.0.0 # v8.0.0
        env:
          GKY_SETTINGS: ${{ env.gkySettings }}
          TEMPLATE_REPOSITORY_INPUT: ${{ inputs.templateRepository }}
          BASE_REPOSITORY_INPUT: ${{ inputs.baseRepository }}
          ORIGINAL_REF_INPUT: ${{ inputs.originalRef }}
          NEW_REF_INPUT: ${{ inputs.newRef }}
        with:
          script: |
            const settings = JSON.parse(process.env.GKY_SETTINGS || '{}');
            const workflowUpdater = settings.workflowUpdater || {};
            const resolveValue = (inputName, settingName) =>
              process.env[inputName] || workflowUpdater[settingName] || '';

            const templateRepository = resolveValue('TEMPLATE_REPOSITORY_INPUT', 'templateRepository');
            const baseRepository = resolveValue('BASE_REPOSITORY_INPUT', 'baseRepository');
            const originalRef = resolveValue('ORIGINAL_REF_INPUT', 'baseRef');
            const newRef = resolveValue('NEW_REF_INPUT', 'templateRef');

            if (!baseRepository) {
              core.setFailed(
                'baseRepository is empty and gkySettings.workflowUpdater.baseRepository is not configured.'
              );
              return;
            }

            core.setOutput('templateRepository', templateRepository);
            core.setOutput('baseRepository', baseRepository);
            core.setOutput('originalRef', originalRef);
            core.setOutput('newRef', newRef);

      - name: Resolve branches to update
        id: resolve-branches
        uses: actions/github-script@v9.0.0 # v8.0.0
        env:
          INCLUDE_BRANCHES: ${{ inputs.includeBranches }}
          CURRENT_BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const branches = process.env.INCLUDE_BRANCHES
              ? process.env.INCLUDE_BRANCHES.split(',').map(branch => branch.trim())
              : [process.env.CURRENT_BRANCH];
            core.setOutput('branches', JSON.stringify(branches));

      - name: Resolve new template ref
        id: resolve-ref
        uses: actions/github-script@v9.0.0 # v8.0.0
        env:
          NEW_REF_INPUT: ${{ steps.resolve-settings.outputs.newRef }}
          TEMPLATE_REPO: ${{ steps.resolve-settings.outputs.templateRepository }}
        with:
          github-token: ${{ github.token }}
          script: |
            if (process.env.NEW_REF_INPUT) {
              core.setOutput('newRef', process.env.NEW_REF_INPUT);
              return;
            }

            const [owner, repo] = process.env.TEMPLATE_REPO.split('/');
            if (!owner || !repo) {
              core.setFailed('templateRepository must use the owner/repo format.');
              return;
            }

            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;
            const ref = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${defaultBranch}`
            });
            core.setOutput('newRef', ref.data.object.sha);

  # ──────────────────────────────────────────────────────────────
  # For each branch: fetch both workflow directories, run the
  # merger in directory mode, then commit directly or open a PR.
  # ──────────────────────────────────────────────────────────────
  merge-workflows:
    name: '[${{ matrix.branch }}] Merge & Commit'
    needs: [Initialize]
    runs-on: [ self-hosted, ubuntu-latest ]
    strategy:
      matrix:
        branch: ${{ fromJson(needs.Initialize.outputs.updateBranches) }}
      fail-fast: false

    steps:
      # ── 1. Check out destination branch ──────────────────────
      - name: Checkout destination
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.0
        with:
          shell: powershell
          get: gkySettings, CICDPushBranches, CICDPullRequestBranches, runs-on, gitHubRunner, shell

      - name: Prepare runner settings
        id: runner-settings
        uses: actions/github-script@v9.0.0 # v8.0.0
        env:
          RUNS_ON: ${{ env['runs-on'] }}
          GITHUB_RUNNER: ${{ env.githubRunner }}
        with:
          script: |
            const toRunnerArray = (value, settingName) => {
              if (!value) {
                throw new Error(`${settingName} is not configured.`);
              }
              return value.split(',').map(label => label.trim());
            };

            core.setOutput('runs-on', JSON.stringify(toRunnerArray(process.env.RUNS_ON, 'runs-on')));
            core.setOutput(
              'github-runner',
              JSON.stringify(toRunnerArray(process.env.GITHUB_RUNNER, 'githubRunner'))
            );

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v9.0
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'TokenForPush'
          useGhTokenWorkflowForPush: 'true'

      - name: Clean up workspace
        uses: geekyllc/gky-gha-cleanup-workspace@v0.2.1
        with:
          keep-git: false
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}

      # ReadSecrets reads ghTokenWorkflow (algo-ghapptoken in Key Vault), decodes
      # the {"GitHubAppClientId":"...","PrivateKey":"..."} JSON and calls
      # GetGitHubAppAuthToken to produce a real installation token, exposed as
      # steps.ReadSecrets.outputs.TokenForPush. Our custom Octokit-based actions
      # need that real bearer token — NOT the raw base64-encoded JSON blob that
      # fromJson(steps.ReadSecrets.outputs.Secrets).ghTokenWorkflow would return.

      # ── 2. Fetch ORIGINAL (base) workflow directory ───────────
      - name: Fetch original template workflows
        uses: geekyllc/gky-gha-fetch-workflow-files@v0.2.1
        with:
          token: ${{ github.token }}
          repository: ${{ needs.Initialize.outputs.baseRepository }}
          ref: ${{ needs.Initialize.outputs.originalRef }}
          output-directory: _merge_tmp/original
          pattern: '.github/workflows'
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      # ── 3. Fetch NEW template workflow directory ──────────────
      - name: Fetch new template workflows
        uses: geekyllc/gky-gha-fetch-workflow-files@v0.2.1
        with:
          token: ${{ github.token }}
          repository: ${{ needs.Initialize.outputs.templateRepository }}
          ref: ${{ needs.Initialize.outputs.resolvedNewRef }}
          output-directory: _merge_tmp/new
          pattern: '.github/workflows'
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      # CheckForUpdates also treats the PowerShell scripts and JSON settings as
      # AL-Go system files.  Checkout just those files so they can be updated
      # with the same rules after the workflow merge.
      - name: Fetch new template scripts and settings
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.Initialize.outputs.templateRepository }}
          ref: ${{ needs.Initialize.outputs.resolvedNewRef }}
          token: ${{ github.token }}
          path: _merge_tmp/new-system-files
          sparse-checkout: |
            .github
            .AL-Go
          sparse-checkout-cone-mode: false

      # ── 4. 3-way merge entire workflow directory ──────────────
      - name: Merge workflow directories
        id: merge
        uses: geekyllc/gky-gha-workflow-merger@v0.2.1
        with:
          original-workflow: _merge_tmp/original
          template-workflow: _merge_tmp/new
          destination-workflow: .github/workflows
          output-path: .github/workflows
          conflict-strategy: ${{ inputs.conflictStrategy }}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Update AL-Go scripts and settings
        shell: pwsh
        env:
          SYSTEM_FILES_SOURCE: _merge_tmp/new-system-files
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE $env:SYSTEM_FILES_SOURCE

          # CheckForUpdates replaces system scripts with the template version.
          Get-ChildItem -Path (Join-Path $sourceRoot '.github') -Filter '*.ps1' -File -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $env:GITHUB_WORKSPACE ".github/$($_.Name)") -Force
            }

          # AL-Go project files are applied once per project. Existing .AL-Go
          # settings files identify the project destinations; a root project is
          # used when the repository does not contain one yet.
          $projectSettings = @(
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter 'settings.json' -File -Recurse -Force |
              Where-Object {
                $_.Directory.Name -eq '.AL-Go' -and
                -not $_.FullName.StartsWith((Join-Path $env:GITHUB_WORKSPACE '_merge_tmp'))
              }
          )
          if ($projectSettings.Count -eq 0) {
            $projectSettings = @([pscustomobject]@{
              Directory = [System.IO.DirectoryInfo](Join-Path $env:GITHUB_WORKSPACE '.AL-Go')
              FullName = Join-Path $env:GITHUB_WORKSPACE '.AL-Go/settings.json'
            })
          }

          $projectScriptSource = Join-Path $sourceRoot '.AL-Go'
          foreach ($projectSetting in $projectSettings) {
            New-Item -Path $projectSetting.Directory.FullName -ItemType Directory -Force | Out-Null
            Get-ChildItem -Path $projectScriptSource -Filter '*.ps1' -File -ErrorAction SilentlyContinue |
              ForEach-Object {
                Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $projectSetting.Directory.FullName $_.Name) -Force
              }
          }

          # For JSON settings, CheckForUpdates preserves every destination
          # value and only refreshes/adds the template's $schema. If a settings
          # file is new, the template file is copied in full.
          function Update-ALGoSettingsFile {
            param([string] $Source, [string] $Destination)

            if (-not (Test-Path -LiteralPath $Source -PathType Leaf)) { return }
            if (-not (Test-Path -LiteralPath $Destination -PathType Leaf)) {
              New-Item -Path (Split-Path $Destination -Parent) -ItemType Directory -Force | Out-Null
              Copy-Item -LiteralPath $Source -Destination $Destination -Force
              return
            }

            $sourceSettings = Get-Content -LiteralPath $Source -Raw -Encoding utf8 | ConvertFrom-Json
            $destinationSettings = Get-Content -LiteralPath $Destination -Raw -Encoding utf8 | ConvertFrom-Json
            if ($sourceSettings.PSObject.Properties.Name -contains '$schema') {
              $destinationSettings | Add-Member -MemberType NoteProperty -Name '$schema' -Value $sourceSettings.'$schema' -Force
              $destinationSettings = $destinationSettings |
                Select-Object @{ Name = '$schema'; Expression = { $_.'$schema' } }, * -ExcludeProperty '$schema'
              $destinationSettings | ConvertTo-Json -Depth 100 |
                Set-Content -LiteralPath $Destination -Encoding utf8NoBOM
            }
          }

          $githubSource = Join-Path $sourceRoot '.github'
          @(
            Get-ChildItem -Path $githubSource -Filter '*.settings.json' -File -ErrorAction SilentlyContinue
            Get-Item -LiteralPath (Join-Path $githubSource 'AL-Go-Settings.json') -ErrorAction SilentlyContinue
          ) | Where-Object { $_ } | ForEach-Object {
            Update-ALGoSettingsFile -Source $_.FullName -Destination (Join-Path $env:GITHUB_WORKSPACE ".github/$($_.Name)")
          }

          $projectSettingsSource = Join-Path $projectScriptSource 'settings.json'
          foreach ($projectSetting in $projectSettings) {
            Update-ALGoSettingsFile -Source $projectSettingsSource -Destination $projectSetting.FullName
          }

          # The nested checkout is an implementation detail, not an update.
          Remove-Item -LiteralPath $sourceRoot -Recurse -Force

      # ── 5. Apply repository-specific workflow settings ───────
      - name: Replace CI/CD push branches
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/CICD.yaml
          replacements: >-
            {"on.push.branches":${{ toJSON(fromJSON(env.Settings).CICDPushBranches) }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace pull request branches
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/PullRequestHandler.yaml
          replacements: >-
            {"on.pull_request.branches":${{ toJSON(fromJSON(env.Settings).CICDPullRequestBranches) }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace default workflow shells
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          # Reusable workflows begin with "_" and receive their shell as an
          # input; all other AL-Go YAML workflows declare defaults.run.shell.
          workflows: .github/workflows/[!_]*.yaml
          replacements: >-
            {"defaults.run.shell":${{ toJSON(fromJSON(env.Settings).shell) }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace standard runners in test workflows
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: >-
            [".github/workflows/Current.yaml",
            ".github/workflows/NextMajor.yaml",
            ".github/workflows/NextMinor.yaml"]
          replacements: >-
            {"jobs.Initialization.runs-on":${{ steps.runner-settings.outputs.runs-on }},
            "jobs.PostProcess.runs-on":${{ steps.runner-settings.outputs.runs-on }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace standard runners in pull request handler
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/PullRequestHandler.yaml
          replacements: >-
            {"jobs.Initialization.runs-on":${{ steps.runner-settings.outputs.runs-on }},
            "jobs.CodeAnalysisUpload.runs-on":${{ steps.runner-settings.outputs.runs-on }},
            "jobs.StatusCheck.runs-on":${{ steps.runner-settings.outputs.runs-on }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace GitHub runners in system update workflow
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/UpdateGitHubGoSystemFiles.yaml
          replacements: >-
            {"jobs.Initialize.runs-on":${{ steps.runner-settings.outputs.github-runner }},
            "jobs.UpdateALGoSystemFiles.runs-on":${{ steps.runner-settings.outputs.github-runner }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace standard runner in add existing app workflow
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/AddExistingAppOrTestApp.yaml
          replacements: >-
            {"jobs.AddExistingAppOrTestApp.runs-on":${{ steps.runner-settings.outputs.runs-on }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace standard runner in create app workflow
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/CreateApp.yaml
          replacements: >-
            {"jobs.CreateApp.runs-on":${{ steps.runner-settings.outputs.runs-on }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace standard runner in create test app workflow
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/CreateTestApp.yaml
          replacements: >-
            {"jobs.CreateTestApp.runs-on":${{ steps.runner-settings.outputs.runs-on }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace standard runner in create performance test app workflow
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/CreatePerformanceTestApp.yaml
          replacements: >-
            {"jobs.CreatePerformanceTestApp.runs-on":${{ steps.runner-settings.outputs.runs-on }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace standard runner in online development workflow
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/CreateOnlineDevelopmentEnvironment.yaml
          replacements: >-
            {"jobs.Initialization.runs-on":${{ steps.runner-settings.outputs.runs-on }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace standard runner in reference documentation workflow
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/DeployReferenceDocumentation.yaml
          replacements: >-
            {"jobs.DeployALDoc.runs-on":${{ steps.runner-settings.outputs.runs-on }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace standard runner in increment version workflow
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/IncrementVersionNumber.yaml
          replacements: >-
            {"jobs.IncrementVersionNumber.runs-on":${{ steps.runner-settings.outputs.runs-on }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace GitHub runner in troubleshooting workflow
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/Troubleshooting.yaml
          replacements: >-
            {"jobs.Troubleshooting.runs-on":${{ steps.runner-settings.outputs.github-runner }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace standard runners in CI/CD workflow
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/CICD.yaml
          replacements: >-
            {"jobs.Initialization.runs-on":${{ steps.runner-settings.outputs.runs-on }},
            "jobs.CheckForUpdates.runs-on":${{ steps.runner-settings.outputs.runs-on }},
            "jobs.CodeAnalysisUpload.runs-on":${{ steps.runner-settings.outputs.runs-on }},
            "jobs.DeployALDoc.runs-on":${{ steps.runner-settings.outputs.runs-on }},
            "jobs.Deliver.runs-on":${{ steps.runner-settings.outputs.runs-on }},
            "jobs.PostProcess.runs-on":${{ steps.runner-settings.outputs.runs-on }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace standard runners in publish workflow
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/PublishToEnvironment.yaml
          replacements: >-
            {"jobs.Initialization.runs-on":${{ steps.runner-settings.outputs.runs-on }},
            "jobs.PostProcess.runs-on":${{ steps.runner-settings.outputs.runs-on }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      - name: Replace standard runners in create release workflow
        uses: geekyllc/gky-gha-workflow-replacer@v0.2.1
        with:
          workflows: .github/workflows/CreateRelease.yaml
          replacements: >-
            {"jobs.CreateRelease.runs-on":${{ steps.runner-settings.outputs.runs-on }},
            "jobs.UploadArtifacts.runs-on":${{ steps.runner-settings.outputs.runs-on }},
            "jobs.CreateReleaseBranch.runs-on":${{ steps.runner-settings.outputs.runs-on }},
            "jobs.UpdateVersionNumber.runs-on":${{ steps.runner-settings.outputs.runs-on }},
            "jobs.PostProcess.runs-on":${{ steps.runner-settings.outputs.runs-on }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      # ── 6. Detect whether anything actually changed ───────────
      - name: Check for changes
        id: check-changes
        uses: geekyllc/gky-gha-check-git-changes@v0.2.1
        with:
          paths: >-
            .github/workflows/**, .github/*.ps1, .github/*.settings.json,
            .github/AL-Go-Settings.json, **/.AL-Go/*.ps1, **/.AL-Go/settings.json
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}

      # ── 7. Compute safe branch name (for PR branch) ───────────
      - name: Normalize template refs for branch name
        id: branch-refs
        if: steps.check-changes.outputs.has_changes == 'true' && inputs.directCommit != true
        uses: actions/github-script@v9.0.0 # v8.0.0
        env:
          ORIGINAL_REF: ${{ needs.Initialize.outputs.originalRef }}
          NEW_REF: ${{ needs.Initialize.outputs.resolvedNewRef }}
        with:
          script: |
            const shortenSha = ref => /^[0-9a-f]{40}([0-9a-f]{24})?$/i.test(ref)
              ? ref.slice(0, 7)
              : ref;

            core.setOutput('original', shortenSha(process.env.ORIGINAL_REF));
            core.setOutput('new', shortenSha(process.env.NEW_REF));

      - name: Generate update branch name
        id: branch-name
        if: steps.check-changes.outputs.has_changes == 'true' && inputs.directCommit != true
        uses: geekyllc/gky-gha-string-template@v0.2.1
        with:
          templates: >-
            ["update-workflows/{{filenameSafe data.branch}}-{{filenameSafe data.originalRef}}-{{filenameSafe data.newRef}}"]
          data: >-
            {"branch":${{ toJSON(matrix.branch) }},
            "originalRef":${{ toJSON(steps.branch-refs.outputs.original) }},
            "newRef":${{ toJSON(steps.branch-refs.outputs.new) }}}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          emit-summary: ${{ toJSON(env.gkySettings).emitSummary || 'true' }}

      # ── 8a. Direct commit ─────────────────────────────────────
      - name: Commit and push directly
        if: steps.check-changes.outputs.has_changes == 'true' && inputs.directCommit == true
        uses: geekyllc/gky-gha-commit-and-push@v0.2.1
        with:
          token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          commit_message: >-
            chore: update workflows via 3-way merge from
            ${{ needs.Initialize.outputs.templateRepository }}@${{ needs.Initialize.outputs.resolvedNewRef }}
          path: >-
            [".github/workflows/**", ".github/*.ps1", ".github/*.settings.json",
            ".github/AL-Go-Settings.json", "**/.AL-Go/*.ps1", "**/.AL-Go/settings.json"]
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}

      # ── 8b. Create pull request ───────────────────────────────
      - name: Commit and push PR branch
        id: stage
        if: steps.check-changes.outputs.has_changes == 'true' && inputs.directCommit != true
        uses: geekyllc/gky-gha-commit-and-push@v0.2.1
        with:
          token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          target_branch: ${{ steps.branch-name.outputs.result-0 }}
          commit_message: >-
            chore: update workflows via 3-way merge from
            ${{ needs.Initialize.outputs.templateRepository }}@${{ needs.Initialize.outputs.resolvedNewRef }}
          path: >-
            [".github/workflows/**", ".github/*.ps1", ".github/*.settings.json",
            ".github/AL-Go-Settings.json", "**/.AL-Go/*.ps1", "**/.AL-Go/settings.json"]
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}

      - name: Create pull request
        if: >
          steps.check-changes.outputs.has_changes == 'true' &&
          inputs.directCommit != true &&
          steps.stage.outputs.branch_name != matrix.branch
        uses: geekyllc/gky-gha-create-pull-request@v0.2.1
        with:
          token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          source_branch: ${{ steps.stage.outputs.branch_name }}
          target_branch: ${{ matrix.branch }}
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}
          title: 'chore: update workflows via 3-way merge (${{ needs.Initialize.outputs.resolvedNewRef }})'
          body: |
            ## Automated Workflow Update

            This pull request updates `.github/workflows/` by performing a **3-way merge** between:

            | Role | Repository | Ref |
            |------|-----------|-----|
            | Original (base) | `${{ needs.Initialize.outputs.baseRepository }}` | `${{ needs.Initialize.outputs.originalRef }}` |
            | New template | `${{ needs.Initialize.outputs.templateRepository }}` | `${{ needs.Initialize.outputs.resolvedNewRef }}` |
            | Destination | this repository | `${{ matrix.branch }}` |

            ### Conflict strategy
            `${{ inputs.conflictStrategy }}`

      # ── 9. Job summary ────────────────────────────────────────
      - name: Write job summary
        if: always()
        uses: actions/github-script@v9.0.0 # v8.0.0
        env:
          ANY_CHANGES: ${{ steps.check-changes.outputs.has_changes }}
          BRANCH: ${{ matrix.branch }}
          BASE_REPO: ${{ needs.Initialize.outputs.baseRepository }}
          TEMPLATE: ${{ needs.Initialize.outputs.templateRepository }}
          ORIG_REF: ${{ needs.Initialize.outputs.originalRef }}
          NEW_REF: ${{ needs.Initialize.outputs.resolvedNewRef }}
          MERGED: ${{ steps.merge.outputs.merged || 'false' }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts-count || '0' }}
        with:
          script: |
            const code = value => `\`${value}\``;
            await core.summary
              .addHeading(`Workflow Update Summary — branch ${code(process.env.BRANCH)}`, 2)
              .addTable([
                [
                  { data: 'Item', header: true },
                  { data: 'Value', header: true }
                ],
                ['Base repository (original)', code(process.env.BASE_REPO)],
                ['Template repository (new)', code(process.env.TEMPLATE)],
                ['Original ref', code(process.env.ORIG_REF)],
                ['New ref', code(process.env.NEW_REF)],
                ['Files changed', process.env.MERGED],
                ['Step conflicts', process.env.CONFLICTS],
                ['Changes applied', process.env.ANY_CHANGES]
              ])
              .write();
