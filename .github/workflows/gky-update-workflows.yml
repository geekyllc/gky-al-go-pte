name: 'Update Workflows (3-Way Merge)'

on:
  workflow_dispatch:
    inputs:
      templateRepository:
        description: >-
          Template repository in 'owner/repo' format.
          This is the custom template that sits on top of the base AL-Go template.
        required: true
        default: 'geekyllc/gky-al-go-pte'
      baseRepository:
        description: >-
          Base repository in 'owner/repo' format. This is the repository from which
          originalRef was taken (i.e., the template that was previously applied to this
          repository). Leave empty to use templateRepository (same repo for both original
          and new).
        required: false
        default: 'microsoft/AL-Go-PTE'
      originalRef:
        description: >-
          The git ref (tag/commit SHA) of the template that was previously applied to
          this repository. Used as the 'base' in the 3-way merge.
        required: true
        default: 'main'
      newRef:
        description: >-
          The git ref (tag/branch/commit SHA) of the template version to update to.
          Leave empty to use the default branch (HEAD).
        required: false
        default: 'chore/update-config'
      conflictStrategy:
        description: 'How to handle step conflicts: template-wins, destination-wins, or error'
        required: false
        default: 'template-wins'
      directCommit:
        description: 'Commit changes directly to the branch instead of creating a pull request'
        type: boolean
        default: false
      includeBranches:
        description: >-
          Comma-separated list of branches to update. Leave empty to update the
          current branch only.
        required: false
        default: ''

  workflow_call:
    inputs:
      caller:
        description: Name of the calling workflow (use github.workflow as value when calling)
        type: string
        required: true
      templateRepository:
        description: Template repository in 'owner/repo' format
        type: string
        required: true
      baseRepository:
        description: >-
          Base repository in 'owner/repo' format (the repo from which originalRef was
          taken). Leave empty to use templateRepository.
        type: string
        required: false
        default: ''
      originalRef:
        description: The git ref of the previously-applied template (base for 3-way merge)
        type: string
        required: true
      newRef:
        description: The git ref of the template version to update to (empty = HEAD)
        type: string
        required: false
        default: ''
      conflictStrategy:
        description: 'Conflict strategy: template-wins, destination-wins, or error'
        type: string
        required: false
        default: 'template-wins'
      directCommit:
        description: Commit directly instead of creating a pull request
        type: boolean
        default: false
      includeBranches:
        description: Comma-separated list of branches to update (empty = current branch only)
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # Resolve which branches to process and the concrete new ref,
  # then build a branch-only matrix for the MergeAndCommit job.
  # ──────────────────────────────────────────────────────────────
  Initialize:
    name: Initialize
    runs-on: [ self-hosted, ubuntu-latest ]
    outputs:
      updateBranches: ${{ steps.resolve-branches.outputs.branches }}
      resolvedNewRef: ${{ steps.resolve-ref.outputs.newRef }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.0
        with:
          shell: powershell
          get: gkySettings

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v9.0
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'TokenForPush'
          useGhTokenWorkflowForPush: 'true'

      - name: Clean up workspace
        uses: geekyllc/gky-gha-cleanup-workspace@v0.2.1
        with:
          keep-git: false
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}

      - name: Resolve branches to update
        id: resolve-branches
        env:
          INCLUDE_BRANCHES: ${{ inputs.includeBranches }}
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$INCLUDE_BRANCHES" ]; then
            branches="[\"$CURRENT_BRANCH\"]"
          else
            IFS=',' read -ra branch_array <<< "$INCLUDE_BRANCHES"
            json="["
            first=true
            for b in "${branch_array[@]}"; do
              b=$(echo "$b" | xargs)
              if [ "$first" = true ]; then
                json="${json}\"${b}\""
                first=false
              else
                json="${json},\"${b}\""
              fi
            done
            json="${json}]"
            branches="$json"
          fi
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

      - name: Resolve new template ref
        id: resolve-ref
        env:
          NEW_REF_INPUT: ${{ inputs.newRef }}
          TEMPLATE_REPO: ${{ inputs.templateRepository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$NEW_REF_INPUT" ]; then
            echo "newRef=$NEW_REF_INPUT" >> "$GITHUB_OUTPUT"
          else
            default_branch=$(gh api "repos/$TEMPLATE_REPO" --jq '.default_branch')
            sha=$(gh api "repos/$TEMPLATE_REPO/git/ref/heads/$default_branch" --jq '.object.sha')
            echo "newRef=$sha" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────────
  # For each branch: fetch both workflow directories, run the
  # merger in directory mode, then commit directly or open a PR.
  # ──────────────────────────────────────────────────────────────
  merge-workflows:
    name: '[${{ matrix.branch }}] Merge & Commit'
    needs: [Initialize]
    runs-on: [ self-hosted, ubuntu-latest ]
    strategy:
      matrix:
        branch: ${{ fromJson(needs.Initialize.outputs.updateBranches) }}
      fail-fast: false

    steps:
      # ── 1. Check out destination branch ──────────────────────
      - name: Checkout destination
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.0
        with:
          shell: powershell

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v9.0
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'TokenForPush'
          useGhTokenWorkflowForPush: 'true'

      - name: Clean up workspace
        uses: geekyllc/gky-gha-cleanup-workspace@v0.2.1
        with:
          keep-git: false
          min-log-level: ${{ toJSON(env.gkySettings).logLevel || '1' }}

      # ReadSecrets reads ghTokenWorkflow (algo-ghapptoken in Key Vault), decodes
      # the {"GitHubAppClientId":"...","PrivateKey":"..."} JSON and calls
      # GetGitHubAppAuthToken to produce a real installation token, exposed as
      # steps.ReadSecrets.outputs.TokenForPush. Our custom Octokit-based actions
      # need that real bearer token — NOT the raw base64-encoded JSON blob that
      # fromJson(steps.ReadSecrets.outputs.Secrets).ghTokenWorkflow would return.

      # ── 2. Fetch ORIGINAL (base) workflow directory ───────────
      - name: Fetch original template workflows
        uses: geekyllc/gky-gha-fetch-workflow-files@v0.2.1
        with:
          token: ${{ github.token }}
          repository: ${{ inputs.baseRepository || inputs.templateRepository }}
          ref: ${{ inputs.originalRef }}
          output-directory: _merge_tmp/original
          pattern: '.github/workflows'
          min-log-level: 1

      # ── 3. Fetch NEW template workflow directory ──────────────
      - name: Fetch new template workflows
        uses: geekyllc/gky-gha-fetch-workflow-files@v0.2.1
        with:
          token: ${{ github.token }}
          repository: ${{ inputs.templateRepository }}
          ref: ${{ needs.Initialize.outputs.resolvedNewRef }}
          output-directory: _merge_tmp/new
          pattern: '.github/workflows'
          min-log-level: 1

      # ── 4. 3-way merge entire workflow directory ──────────────
      - name: Merge workflow directories
        id: merge
        uses: geekyllc/gky-gha-workflow-merger@v0.2.1
        with:
          original-workflow: _merge_tmp/original
          template-workflow: _merge_tmp/new
          destination-workflow: .github/workflows
          output-path: .github/workflows
          conflict-strategy: ${{ inputs.conflictStrategy }}
          min-log-level: 1

      # ── 5. Detect whether anything actually changed ───────────
      - name: Check for changes
        id: check-changes
        uses: geekyllc/gky-gha-check-git-changes@v0.2.1
        with:
          paths: '.github/workflows/**'

      # ── 6. Compute safe branch name (for PR branch) ───────────
      - name: Compute safe branch name
        id: safe-name
        run: |
          safe=$(echo "${{ matrix.branch }}" | tr '/' '-' | tr ':' '-' | tr ' ' '-')
          echo "branch=$safe" >> "$GITHUB_OUTPUT"

      # ── 7a. Direct commit ─────────────────────────────────────
      - name: Commit and push directly
        if: steps.check-changes.outputs.has_changes == 'true' && inputs.directCommit == true
        uses: geekyllc/gky-gha-commit-and-push@v0.2.1
        with:
          token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          commit_message: >-
            chore: update workflows via 3-way merge from
            ${{ inputs.templateRepository }}@${{ needs.Initialize.outputs.resolvedNewRef }}
          path: '.github/workflows/**'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # ── 7b. Create pull request ───────────────────────────────
      - name: Commit and push PR branch
        id: stage
        if: steps.check-changes.outputs.has_changes == 'true' && inputs.directCommit != true
        uses: geekyllc/gky-gha-commit-and-push@v0.2.1
        with:
          token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          target_branch: update-workflows/${{ steps.safe-name.outputs.branch }}-${{ needs.Initialize.outputs.resolvedNewRef }}
          commit_message: >-
            chore: update workflows via 3-way merge from
            ${{ inputs.templateRepository }}@${{ needs.Initialize.outputs.resolvedNewRef }}
          path: '.github/workflows/**'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Create pull request
        if: >
          steps.check-changes.outputs.has_changes == 'true' &&
          inputs.directCommit != true &&
          steps.stage.outputs.branch_name != matrix.branch
        uses: geekyllc/gky-gha-create-pull-request@v0.2.1
        with:
          token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          source_branch: ${{ steps.stage.outputs.branch_name }}
          target_branch: ${{ matrix.branch }}
          title: 'chore: update workflows via 3-way merge (${{ needs.Initialize.outputs.resolvedNewRef }})'
          body: |
            ## Automated Workflow Update

            This pull request updates `.github/workflows/` by performing a **3-way merge** between:

            | Role | Repository | Ref |
            |------|-----------|-----|
            | Original (base) | `${{ inputs.baseRepository || inputs.templateRepository }}` | `${{ inputs.originalRef }}` |
            | New template | `${{ inputs.templateRepository }}` | `${{ needs.Initialize.outputs.resolvedNewRef }}` |
            | Destination | this repository | `${{ matrix.branch }}` |

            ### Conflict strategy
            `${{ inputs.conflictStrategy }}`

      # ── 8. Job summary ────────────────────────────────────────
      - name: Write job summary
        if: always()
        env:
          ANY_CHANGES: ${{ steps.check-changes.outputs.has_changes }}
          BRANCH: ${{ matrix.branch }}
          BASE_REPO: ${{ inputs.baseRepository || inputs.templateRepository }}
          TEMPLATE: ${{ inputs.templateRepository }}
          ORIG_REF: ${{ inputs.originalRef }}
          NEW_REF: ${{ needs.Initialize.outputs.resolvedNewRef }}
          MERGED: ${{ steps.merge.outputs.merged || 'false' }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts-count || '0' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Workflow Update Summary — branch \`$BRANCH\`

          | Item | Value |
          |------|-------|
          | Base repository (original) | \`$BASE_REPO\` |
          | Template repository (new) | \`$TEMPLATE\` |
          | Original ref | \`$ORIG_REF\` |
          | New ref | \`$NEW_REF\` |
          | Files changed | $MERGED |
          | Step conflicts | $CONFLICTS |
          | Changes applied | $ANY_CHANGES |
          EOF
